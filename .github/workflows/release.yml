name: release

# Builds the beeperbox image and publishes it to GHCR — gated on the same
# functional tests the PRs run, so a broken build (or a broken upstream Beeper
# pulled by the weekly rebuild) can't silently become :latest.
#
# Flow for the release path (tag push / weekly cron / manual dispatch):
#   prepare  -> resolve which ref to build + read its pinned Beeper (beeper-version.txt)
#   verify   -> build amd64, run the MCP + VNC guard checks and the first-paint check (the gate)
#   verify-arm64 -> build arm64 natively (ubuntu-24.04-arm), run the first-paint check only
#               (the renderer/GL path is per-arch; the other gates stay amd64-only)
#   publish  -> roll current :latest to :previous, then build+push multi-arch
#               semver tags + :latest  (only runs if verify AND verify-arm64 passed)
# If either verify job fails, publish is skipped: the previous :latest stays live as the
# last-known-good image, :previous is untouched, and notify-failure flags it: a step
# summary on the run, plus a GitHub issue labelled release-gate-failed, assigned to the
# repo owner (GitHub emails them). One open issue at a time: repeat failures comment on it.
#
# Triggers:
#   - tag push (v*.*.*)        -> :X.Y.Z, :X.Y, :X, :latest (gated)
#   - weekly cron (Mon 06 UTC) -> rebuild newest release tag at its pinned Beeper (gated)
#   - manual dispatch          -> ad-hoc gated rebuild of newest release tag
#   - push to master           -> :edge (bleeding-edge, ungated by design)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Resolve the ref to build. Tag push builds the pushed tag; schedule/dispatch
  # resolve the newest release tag so :latest tracks released code, not master.
  prepare:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      skip: ${{ steps.ref.outputs.skip }}
      beeper_version: ${{ steps.beeper.outputs.version }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git_ref=$(git ls-remote --tags --sort=-v:refname https://github.com/${{ github.repository }}.git 'v*.*.*' \
              | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' | head -n1)
            if [ -z "$git_ref" ]; then
              echo "No release tag found; nothing to rebuild."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ref=$git_ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # The Beeper version is PINNED in beeper-version.txt and read from the
      # RELEASE ref (the tag being built), not the workflow ref: each tag carries
      # its own Beeper, so the weekly rebuild of a tag is reproducible and :latest
      # never jumps to an unvetted Beeper. Newer Beepers are offered separately as
      # :next (beeper-next.yml) and promoted by changing the pin in a PR. Fails
      # closed: a ref without the pin file fails prepare (no fall back to latest
      # stable). The script comes from the workflow ref (latest), like the other
      # test tooling; the pin file from the release ref, checked out to a side
      # path (same pattern as .ci-tools in the gate jobs).
      - name: Checkout pin script (latest workflow ref)
        if: steps.ref.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Checkout release ref (for its Beeper pin)
        if: steps.ref.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: .release-ref

      - name: Read pinned Beeper version
        id: beeper
        if: steps.ref.outputs.skip != 'true'
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          pin=".release-ref/beeper-version.txt"
          if [ ! -f "$pin" ]; then
            echo "::error::Release ref $REF has no beeper-version.txt; refusing to fall back to latest stable Beeper. Add the pin file in a release that includes it."
            exit 1
          fi
          v="$(bash scripts/pinned-beeper-version.sh "$pin")"
          if [ -z "$v" ]; then
            echo "::error::Pinned Beeper version resolved empty"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The gate: build the candidate image and run the same checks the PRs run.
  # Nothing here pushes to GHCR.
  verify:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Build context = the release ref (what actually ships). But the gate
      # scripts come from the workflow ref (latest), NOT the release ref: the
      # weekly cron rebuilds the newest release *tag*, which can predate the
      # test tooling (e.g. v0.5.0 was tagged before these scripts existed). The
      # scripts are black-box probes of the built image, so taking them from
      # latest is correct and avoids "script not found" on older tags.
      - name: Checkout build context (release ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Checkout test tooling (latest workflow ref)
        uses: actions/checkout@v6
        with:
          path: .ci-tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate (amd64, load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: beeperbox:candidate
          build-args: BEEPER_VERSION=${{ needs.prepare.outputs.beeper_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: MCP guard gate
        run: bash .ci-tools/scripts/mcp-guard-check.sh beeperbox:candidate

      - name: First-paint gate
        run: bash .ci-tools/scripts/first-paint-check.sh beeperbox:candidate

      - name: Install Xvfb + x11vnc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11vnc

      - name: VNC auth gate
        run: bash .ci-tools/scripts/vnc-auth-check.sh

  # arm64 leg of the gate: publish ships arm64 too, and the first-paint failure
  # class (GL/renderer under Xvfb) is architecture-specific. Native arm runner,
  # no QEMU. Only the first-paint check runs here; MCP guard + VNC auth stay
  # amd64-only. Same checkout pattern as verify. Nothing here pushes to GHCR.
  verify-arm64:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout build context (release ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Checkout test tooling (latest workflow ref)
        uses: actions/checkout@v6
        with:
          path: .ci-tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate (arm64, load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: beeperbox:candidate
          build-args: BEEPER_VERSION=${{ needs.prepare.outputs.beeper_version }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: First-paint gate (arm64)
        run: bash .ci-tools/scripts/first-paint-check.sh beeperbox:candidate

  # Publish only runs if both verify jobs passed. Rolls the current :latest to :previous
  # for a known-good fallback, then builds + pushes the multi-arch image.
  publish:
    needs: [prepare, verify, verify-arm64]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll current :latest -> :previous (known-good fallback)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/beeperbox
          if docker buildx imagetools inspect "$IMG:latest" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMG:previous" "$IMG:latest"
            echo "rolled $IMG:latest -> $IMG:previous"
          else
            echo "no existing :latest yet — skipping :previous roll (first publish)"
          fi

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/beeperbox
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.ref }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.ref }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BEEPER_VERSION=${{ needs.prepare.outputs.beeper_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Flags a failed gate/publish loudly: a step summary on the run, plus a GitHub
  # issue (label release-gate-failed, assigned to the repo owner) so the failure
  # arrives as a notification. If an issue with that label is already open, the
  # new failure is added as a comment instead of opening a duplicate; closing the
  # issue after the fix lets the next failure open a fresh one. On a gate failure
  # :latest is unchanged ("we did NOT ship"); if publish itself failed the push may
  # be partial, and the issue body says so. Job-level permissions replace the
  # workflow-level set, so this job lists exactly what it needs.
  notify-failure:
    needs: [prepare, verify, verify-arm64, publish]
    if: failure() && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Summarize
        env:
          REF: ${{ needs.prepare.outputs.ref }}
          RES_PUBLISH: ${{ needs.publish.result }}
        run: |
          {
            if [ "$RES_PUBLISH" = "failure" ]; then
              echo "## ⚠️ Release publish failed — the push may have been partial"
              echo ""
              echo "Ref: \`$REF\`"
              echo ""
              echo "The publish job failed part-way, so some tags may have moved. Check the GHCR tags (\`:latest\`, \`:previous\`, and the version tags) before re-running."
            else
              echo "## ⚠️ Release gate failed — \`:latest\` was NOT updated"
              echo ""
              echo "Ref: \`$REF\`"
              echo ""
              echo "The verify (guard tests) or publish step failed. The previous \`:latest\` remains the live image and \`:previous\` is unchanged — nothing broken was shipped. Investigate the failing job before re-running."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # All ${{ }} values arrive through env and are used only as quoted shell
      # variables: nothing from the event or job outputs is interpolated into code.
      - name: Open or update release-gate-failed issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ needs.prepare.outputs.ref }}
          BEEPER_VERSION: ${{ needs.prepare.outputs.beeper_version }}
          EVENT: ${{ github.event_name }}
          RES_PREPARE: ${{ needs.prepare.result }}
          RES_VERIFY: ${{ needs.verify.result }}
          RES_VERIFY_ARM64: ${{ needs.verify-arm64.result }}
          RES_PUBLISH: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BV="${BEEPER_VERSION:-unresolved}"
          BODY="$(mktemp)"
          {
            cat <<EOF
          The release workflow failed.

          - Ref: \`$REF\`
          - Beeper version: \`$BV\`
          - Trigger: \`$EVENT\`
          - Run: $RUN_URL

          | Job | Result |
          |---|---|
          | prepare | $RES_PREPARE |
          | verify | $RES_VERIFY |
          | verify-arm64 | $RES_VERIFY_ARM64 |
          | publish | $RES_PUBLISH |

          EOF
            if [ "$RES_PUBLISH" = "failure" ]; then
              echo "The gates passed but the publish step itself failed, so the push may have been partial. Check the tags on GHCR (\`:latest\`, \`:previous\`, the version tags) before assuming anything."
            else
              echo "Nothing was shipped: the previous \`:latest\` is still the live image and \`:previous\` is unchanged."
            fi
            echo ""
            echo "After the fix, close this issue; the next failure will then open a fresh one."
          } > "$BODY"

          gh label create release-gate-failed --color B60205 \
            --description "A release workflow run failed its gate or publish" --force

          EXISTING="$(gh issue list --label release-gate-failed --state open --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Release gate failed: $REF (Beeper $BV)" \
              --body-file "$BODY" \
              --label release-gate-failed \
              --assignee "$OWNER"
          else
            gh issue comment "$EXISTING" --body-file "$BODY"
          fi

  # Every push to master publishes :edge — bleeding-edge, may break between
  # releases, ungated by design. Users opt in explicitly.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same pin file as the release path (see prepare), read from the checked-out
      # master tree; passed as a build-arg so the build cache refreshes when the
      # pin changes.
      - name: Read pinned Beeper version
        id: beeper
        run: |
          v="$(bash scripts/pinned-beeper-version.sh beeper-version.txt)"
          if [ -z "$v" ]; then
            echo "::error::Pinned Beeper version resolved empty"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/beeperbox
          tags: type=raw,value=edge

      - name: Build and push :edge
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BEEPER_VERSION=${{ steps.beeper.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
