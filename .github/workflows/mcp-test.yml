name: mcp-test

# Functional test for the MCP server (mcp/server.js) as it ships in the image,
# without a logged-in Beeper account. Builds the real image and runs the MCP
# guard matrix (tool contract + auth/Host/Origin/body 200/403/413/401) via the
# shared scripts/mcp-guard-check.sh — the same script release.yml uses as its
# publish gate, so the PR test and the release gate can't drift.
#
# Triggers: workflow_dispatch (on demand) + pull_request on the files that
# affect the built image or the check itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mcp/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'docker-compose.yml'
      - 'scripts/mcp-guard-check.sh'
      - 'scripts/asset-serve-check.js'
      - '.github/workflows/mcp-test.yml'

permissions:
  contents: read

jobs:
  unit:
    # Pure cursor/dedup/echo-guard logic — the seed/poll/dedup bug-class core.
    # No Docker, no Beeper account; runs in seconds.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test mcp/server.test.js
      - name: download_asset integration check (stub Beeper API, no account)
        # Spins the real MCP server against a stub /v1/assets/serve and exercises
        # the tough turns: binary integrity, both byte-cap paths, error branches.
        run: node scripts/asset-serve-check.js

  mcp-guard-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: beeperbox:mcp-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: MCP guard matrix
        run: bash scripts/mcp-guard-check.sh beeperbox:mcp-test
